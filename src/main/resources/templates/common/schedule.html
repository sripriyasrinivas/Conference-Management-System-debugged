<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Schedule | CMS</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<th:block th:replace="~{common/fragments :: navbar}"></th:block>
<div th:replace="~{common/fragments :: alerts}"></div>
<main class="container main-content">
    <div class="page-header">
        <h2><i class="fas fa-calendar-alt"></i> Conference Schedule</h2>
    </div>

    <div th:if="${tracks != null && !#lists.isEmpty(tracks)}" class="track-legend">
        <span class="track-legend-title">Tracks:</span>
        <span th:each="track : ${tracks}" class="badge badge-track" th:text="${track}"></span>
    </div>

    <div th:if="${schedule == null || #maps.isEmpty(schedule)}" class="empty-state">
        <i class="fas fa-calendar-times fa-3x text-muted"></i>
        <p>No sessions scheduled yet.</p>
    </div>

    <div th:each="entry : ${schedule}" th:if="${entry.key != null}" class="schedule-day">
        <div class="schedule-day-header">
            <h3>
                <i class="fas fa-calendar-day"></i>
                <span th:text="${#temporals.format(entry.key,'EEEE, dd MMMM yyyy')}"></span>
            </h3>
        </div>

        <div class="schedule-timeline">
            <div th:each="sess : ${entry.value}" class="schedule-slot"
                 th:classappend="${sess.type != null ? 'slot-type-' + sess.type.name().toLowerCase() : ''}">
                <div class="slot-time">
                    <span th:text="${sess.startTime != null ? sess.startTime : '--:--'}"></span>
                    <span class="time-sep">–</span>
                    <span th:text="${sess.endTime != null ? sess.endTime : '--:--'}"></span>
                </div>
                <div class="slot-content">
                    <div class="slot-header">
                        <h4 th:text="${sess.title != null ? sess.title : 'Untitled Session'}"></h4>
                        <div class="slot-badges">
                            <span th:if="${sess.type != null}"
                                  th:class="'badge badge-session-' + ${sess.type.name().toLowerCase()}"
                                  th:text="${sess.type.displayName}"></span>
                            <span th:if="${sess.track}" class="badge badge-track"
                                  th:text="${sess.track}"></span>
                        </div>
                    </div>
                    <p th:if="${sess.description}" class="slot-description"
                       th:text="${#strings.abbreviate(sess.description, 150)}"></p>
                    <div class="slot-meta">
                        <span th:if="${sess.speaker != null}">
                            <i class="fas fa-microphone"></i>
                            <span th:text="${sess.speaker.fullName}"></span>
                            <span th:if="${sess.speaker.institution}" class="text-muted" 
                                  th:text="' (' + ${sess.speaker.institution} + ')'"></span>
                        </span>
                        <span th:if="${sess.room}">
                            <i class="fas fa-door-open"></i>
                            <span th:text="${sess.room}"></span>
                        </span>
                        <span th:if="${sess.maxCapacity != null && sess.maxCapacity > 0}">
                            <i class="fas fa-users"></i>
                            <span th:text="'Capacity: ' + ${sess.maxCapacity}"></span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="footer"><p>&copy; 2026 Conference Management System</p></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
