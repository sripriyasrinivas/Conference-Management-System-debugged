<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><title>Review Paper | CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<th:block th:replace="~{common/fragments :: navbar}"></th:block>
<div th:replace="~{common/fragments :: alerts}"></div>

<main class="container main-content">
    <div class="page-header">
        <div>
            <h2 th:text="'Review: ' + ${paper.title}">Paper Title</h2>
            <p class="text-muted">Submitted by: <span th:text="${paper.author.fullName}"></span></p>
        </div>
        <a th:href="@{/reviewer/dashboard}" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back</a>
    </div>

    <div class="grid-2-col">
        <div class="card">
            <h3><i class="fas fa-align-left"></i> Abstract</h3>
            <p th:text="${paper.paperAbstract}" style="line-height: 1.6; margin-bottom: 2rem;"></p>

            <h3><i class="fas fa-file-pdf"></i> Full Paper Preview</h3>
            <div style="border: 1px solid #ddd; background: #f9f9f9;">
                <iframe th:src="@{/papers/view/{id}(id=${paper.id})}" 
                        width="100%" 
                        height="700px" 
                        style="border: none;">
                </iframe>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-pen-nib"></i> Submit Your Evaluation</h3>
            <form th:action="@{/reviewer/papers/{id}/review(id=${paper.id})}" method="post">
                <div class="form-group">
                    <label>Score (1-10)</label>
                    <input type="number" name="score" min="1" max="10" class="form-control" required/>
                </div>

                <div class="form-group">
                    <label>Recommendation</label>
                    <select name="recommendation" class="form-control" required>
                        <option value="Strong Accept">Strong Accept</option>
                        <option value="Accept">Accept</option>
                        <option value="Weak Accept">Weak Accept</option>
                        <option value="Borderline">Borderline</option>
                        <option value="Weak Reject">Weak Reject</option>
                        <option value="Reject">Reject</option>
                        <option value="Strong Reject">Strong Reject</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Review Comments (Min 20 chars)</label>
                    <textarea name="comments" class="form-control" rows="10" required 
                              placeholder="Provide detailed feedback for the authors..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-check"></i> Submit Review
                </button>
            </form>
        </div>
    </div>
</main>

<footer class="footer"><p>&copy; 2026 Conference Management System</p></footer>
</body>
</html>
