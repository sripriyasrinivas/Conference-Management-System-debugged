<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/><title>Reviewer Dashboard | CMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<th:block th:replace="~{common/fragments :: navbar}"></th:block>
<div th:replace="~{common/fragments :: alerts}"></div>
<main class="container main-content">
    <div class="page-header">
        <h2><i class="fas fa-search"></i> Reviewer Dashboard</h2>
        <p class="text-muted">Welcome, <span th:text="${reviewer != null ? reviewer.fullName : 'Reviewer'}"></span></p>
    </div>

    <div class="stats-grid">
        <div class="stat-card stat-blue">
            <div class="stat-icon"><i class="fas fa-tasks"></i></div>
            <div class="stat-info">
                <div class="stat-value" th:text="${allReviews != null ? allReviews.size() : 0}">0</div>
                <div class="stat-label">Assigned Reviews</div>
            </div>
        </div>
        <div class="stat-card stat-orange">
            <div class="stat-icon"><i class="fas fa-hourglass-half"></i></div>
            <div class="stat-info">
                <div class="stat-value" th:text="${pendingReviews != null ? pendingReviews.size() : 0}">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </div>
        <div class="stat-card stat-green">
            <div class="stat-icon"><i class="fas fa-check-double"></i></div>
            <div class="stat-info">
                <div class="stat-value" th:text="${completedCount != null ? completedCount : 0}">0</div>
                <div class="stat-label">Completed</div>
            </div>
        </div>
    </div>

    <div class="section-title"><h3><i class="fas fa-clock"></i> Pending Reviews</h3></div>
    <div th:if="${#lists.isEmpty(pendingReviews)}" class="empty-state">
        <i class="fas fa-check-circle fa-3x text-success"></i>
        <p>All caught up! No pending reviews.</p>
    </div>

    <div th:each="review : ${pendingReviews}" class="card review-assignment-card" style="margin-bottom: 1.5rem;">
        <div class="review-assignment-header" style="display: flex; justify-content: space-between; align-items: flex-start;">
            <div>
                <h4 th:text="${review.paper != null ? review.paper.title : 'Untitled Paper'}"></h4>
                <p class="text-muted" style="margin-bottom: 0.5rem;">
                    by <span th:text="${review.paper != null && review.paper.author != null ? review.paper.author.fullName : 'Unknown Author'}"></span>
                </p>
            </div>
            
            <div class="action-buttons" style="display: flex; gap: 10px;">
                <a th:if="${review.paper != null}" 
                   th:href="@{/papers/view/{id}(id=${review.paper.id})}" 
                   target="_blank" 
                   class="btn btn-secondary btn-sm">
                    <i class="fas fa-file-pdf"></i> View Paper
                </a>
                
                <a th:href="@{/reviewer/reviews/{id}(id=${review.id})}" class="btn btn-primary btn-sm">
                    <i class="fas fa-pen"></i> Start Review
                </a>
            </div>
        </div>

        <p class="abstract-preview" style="font-size: 0.9rem; color: #555;"
           th:text="${review.paper != null ? #strings.abbreviate(review.paper.title, 100) : 'No title available.'}"></p>
        
        <div class="review-meta-row" style="margin-top: 1rem; font-size: 0.85rem;">
            <span class="text-muted"><i class="fas fa-tags"></i> <span th:text="${review.paper != null ? review.paper.keywords : 'N/A'}"></span></span>
            <span th:if="${review.deadline != null}" class="deadline-badge" style="margin-left: 20px; color: #d9534f;">
                <i class="fas fa-calendar-times"></i>
                Due: <span th:text="${#temporals.format(review.deadline,'dd MMM yyyy')}"></span>
            </span>
        </div>
    </div>

    <div class="section-title" style="margin-top:2rem"><h3><i class="fas fa-check"></i> Completed Reviews</h3></div>
    <div class="card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Paper Title</th>
                    <th>Score</th>
                    <th>Recommendation</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="review : ${allReviews}" th:if="${review.status != null && review.status.name() == 'SUBMITTED'}">
                    <td th:text="${review.paper != null ? review.paper.title : 'N/A'}"></td>
                    <td><span class="score-badge" th:text="${review.score} + '/10'"></span></td>
                    <td th:text="${review.recommendation}"></td>
                    <td>
                        <a th:if="${review.paper != null}" 
                           th:href="@{/papers/view/{id}(id=${review.paper.id})}" 
                           target="_blank" class="btn btn-sm btn-outline-secondary">
                            <i class="fas fa-eye"></i> View
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
<footer class="footer"><p>&copy; 2026 Conference Management System</p></footer>
</body>
</html>
