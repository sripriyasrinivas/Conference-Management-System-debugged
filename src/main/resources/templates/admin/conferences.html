<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Conferences | CMS Admin</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<th:block th:replace="~{common/fragments :: navbar}"></th:block>
<div th:replace="~{common/fragments :: alerts}"></div>
<main class="container main-content">
    <div class="page-header">
        <h2><i class="fas fa-university"></i> Conference Management</h2>
    </div>
    <div class="grid-2">
        <!-- Create Form -->
        <div class="card">
            <div class="card-header"><h3><i class="fas fa-plus"></i> Create Conference</h3></div>
            <div class="card-body">
                <form th:action="@{/admin/conferences/create}" method="post">
                    <div class="form-group">
                        <label>Conference Name *</label>
                        <input type="text" name="name" class="form-control" required/>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Venue</label>
                        <input type="text" name="venue" class="form-control"/>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Start Date</label>
                            <input type="date" id="confStartDate" name="startDate" class="form-control"
                                   onchange="validateConferenceDates()"/>
                        </div>
                        <div class="form-group">
                            <label>End Date</label>
                            <input type="date" id="confEndDate" name="endDate" class="form-control"
                                   onchange="validateConferenceDates()"/>
                            <small class="text-muted">Must be after start date</small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Submission Deadline</label>
                            <input type="date" id="submissionDeadline" name="submissionDeadline" class="form-control"
                                   onchange="validateConferenceDeadlines()"/>
                            <small class="text-muted">Before start date</small>
                        </div>
                        <div class="form-group">
                            <label>Review Deadline</label>
                            <input type="date" id="reviewDeadline" name="reviewDeadline" class="form-control"
                                   onchange="validateConferenceDeadlines()"/>
                            <small class="text-muted">After submission, before start</small>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Notification Date</label>
                            <input type="date" id="notificationDate" name="notificationDate" class="form-control"
                                   onchange="validateConferenceDeadlines()"/>
                            <small class="text-muted">After review, before start</small>
                        </div>
                        <div class="form-group">
                            <label>Max Attendees</label>
                            <input type="number" name="maxAttendees" class="form-control" value="300"/>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Contact Email</label>
                        <input type="email" name="contactEmail" class="form-control"/>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-plus"></i> Create Conference
                    </button>
                </form>
            </div>
        </div>

        <!-- List -->
        <div class="card">
            <div class="card-header"><h3><i class="fas fa-list"></i> All Conferences</h3></div>
            <div class="card-body scroll-box">
                <div th:each="conf : ${conferences}" class="conference-item">
                    <div class="conference-item-header">
                        <strong th:text="${conf.name}"></strong>
                        <span th:class="'badge badge-conf-' + ${conf.status.name().toLowerCase()}"
                              th:text="${conf.status}"></span>
                    </div>
                    <div class="conference-item-meta">
                        <span><i class="fas fa-map-marker-alt"></i> <span th:text="${conf.venue}"></span></span>
                        <span><i class="fas fa-calendar"></i>
                            <span th:text="${conf.startDate} + ' → ' + ${conf.endDate}"></span></span>
                        <span><i class="fas fa-users"></i>
                            <span th:text="${conf.registrations.size()} + '/' + ${conf.maxAttendees}"></span>
                        </span>
                    </div>
                    <div class="conference-item-actions">
                        <a th:href="@{/admin/conferences/{id}/edit(id=${conf.id})}"
                           class="btn btn-sm btn-secondary">
                            <i class="fas fa-edit"></i> Edit
                        </a>
                        <!-- Facade: close conference (issues certs + marks COMPLETED) -->
                        <form th:action="@{/admin/conferences/{id}/close(id=${conf.id})}"
                              method="post" style="display:inline"
                              onsubmit="return confirm('Close this conference and issue all certificates?')">
                            <button type="submit" class="btn btn-sm btn-danger">
                                <i class="fas fa-lock"></i> Close
                            </button>
                        </form>
                        <!-- Facade: publish schedule (Builder + status update) -->
                        <form th:action="@{/admin/conferences/{id}/publish-schedule(id=${conf.id})}"
                              method="post" style="display:inline">
                            <button type="submit" class="btn btn-sm btn-success">
                                <i class="fas fa-calendar-check"></i> Publish Schedule
                            </button>
                        </form>
                        <form th:action="@{/admin/conferences/{id}/status(id=${conf.id})}"
                              method="post" style="display:inline-flex; gap:0.25rem; align-items:center">
                            <select name="status" class="form-control form-control-sm">
                                <option th:each="s : ${T(com.cms.model.Conference.ConferenceStatus).values()}"
                                        th:value="${s}" th:text="${s}"
                                        th:selected="${conf.status == s}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-primary">
                                <i class="fas fa-sync"></i>
                            </button>
                        </form>
                    </div>
                </div>
                <div th:if="${#lists.isEmpty(conferences)}" class="text-center text-muted">
                    No conferences yet.
                </div>
            </div>
        </div>
    </div>
</main>
<footer class="footer"><p>&copy; 2026 Conference Management System</p></footer>
<script th:src="@{/js/app.js}"></script>
<script>
function validateConferenceDates() {
    const startDateInput = document.getElementById('confStartDate');
    const endDateInput = document.getElementById('confEndDate');
    
    if (startDateInput.value && endDateInput.value) {
        if (startDateInput.value >= endDateInput.value) {
            endDateInput.setCustomValidity('End date must be after start date');
            endDateInput.style.borderColor = 'red';
        } else {
            endDateInput.setCustomValidity('');
            endDateInput.style.borderColor = '';
        }
    }
    validateConferenceDeadlines();
}

function validateConferenceDeadlines() {
    const startDate = document.getElementById('confStartDate')?.value;
    const submissionDL = document.getElementById('submissionDeadline')?.value;
    const reviewDL = document.getElementById('reviewDeadline')?.value;
    const notificationDate = document.getElementById('notificationDate')?.value;
    
    const submissionInput = document.getElementById('submissionDeadline');
    const reviewInput = document.getElementById('reviewDeadline');
    const notificationInput = document.getElementById('notificationDate');
    
    // Reset all styles
    [submissionInput, reviewInput, notificationInput].forEach(el => {
        if (el) {
            el.setCustomValidity('');
            el.style.borderColor = '';
        }
    });
    
    // Submission deadline must be before start date
    if (submissionDL && startDate && submissionDL >= startDate) {
        submissionInput.setCustomValidity('Submission deadline must be before conference start date');
        submissionInput.style.borderColor = 'red';
    }
    
    // Review deadline must be after submission deadline
    if (reviewDL && submissionDL && reviewDL <= submissionDL) {
        reviewInput.setCustomValidity('Review deadline must be after submission deadline');
        reviewInput.style.borderColor = 'red';
    }
    
    // Review deadline must be before start date
    if (reviewDL && startDate && reviewDL >= startDate) {
        reviewInput.setCustomValidity('Review deadline must be before conference start date');
        reviewInput.style.borderColor = 'red';
    }
    
    // Notification date must be after review deadline
    if (notificationDate && reviewDL && notificationDate <= reviewDL) {
        notificationInput.setCustomValidity('Notification date must be after review deadline');
        notificationInput.style.borderColor = 'red';
    }
    
    // Notification date must be before start date
    if (notificationDate && startDate && notificationDate >= startDate) {
        notificationInput.setCustomValidity('Notification date must be before conference start date');
        notificationInput.style.borderColor = 'red';
    }
    validateConferenceDeadlines();
}

function validateConferenceDeadlines() {
    const startDate = document.getElementById('confStartDate')?.value;
    const submissionDL = document.getElementById('submissionDeadline')?.value;
    const reviewDL = document.getElementById('reviewDeadline')?.value;
    const notificationDate = document.getElementById('notificationDate')?.value;
    
    const submissionInput = document.getElementById('submissionDeadline');
    const reviewInput = document.getElementById('reviewDeadline');
    const notificationInput = document.getElementById('notificationDate');
    
    // Reset all styles
    [submissionInput, reviewInput, notificationInput].forEach(el => {
        if (el) {
            el.setCustomValidity('');
            el.style.borderColor = '';
        }
    });
    
    // Submission deadline must be before start date
    if (submissionDL && startDate && submissionDL >= startDate) {
        submissionInput.setCustomValidity('Submission deadline must be before conference start date');
        submissionInput.style.borderColor = 'red';
    }
    
    // Review deadline must be after submission deadline
    if (reviewDL && submissionDL && reviewDL <= submissionDL) {
        reviewInput.setCustomValidity('Review deadline must be after submission deadline');
        reviewInput.style.borderColor = 'red';
    }
    
    // Review deadline must be before start date
    if (reviewDL && startDate && reviewDL >= startDate) {
        reviewInput.setCustomValidity('Review deadline must be before conference start date');
        reviewInput.style.borderColor = 'red';
    }
    
    // Notification date must be after review deadline
    if (notificationDate && reviewDL && notificationDate <= reviewDL) {
        notificationInput.setCustomValidity('Notification date must be after review deadline');
        notificationInput.style.borderColor = 'red';
    }
    
    // Notification date must be before start date
    if (notificationDate && startDate && notificationDate >= startDate) {
        notificationInput.setCustomValidity('Notification date must be before conference start date');
        notificationInput.style.borderColor = 'red';
    }
}
</script>
</body>
</html>
