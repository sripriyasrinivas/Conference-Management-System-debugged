<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Conference Summary | CMS</title>
<link rel="stylesheet" th:href="@{/css/style.css}"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<th:block th:replace="~{common/fragments :: navbar}"></th:block>
<div th:replace="~{common/fragments :: alerts}"></div>
<main class="container main-content">
    <div class="page-header">
        <div>
            <h2><i class="fas fa-chart-pie"></i> Conference Summary</h2>
            <p class="text-muted" th:text="${conference?.name}"></p>
        </div>
        <a th:href="@{/admin/conferences}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    <!-- Stats from Facade (aggregated from 4 services) -->
    <div class="stats-grid">
        <div class="stat-card stat-blue">
            <div class="stat-icon"><i class="fas fa-ticket-alt"></i></div>
            <div class="stat-info">
                <div class="stat-value" th:text="${totalRegistrations}">0</div>
                <div class="stat-label">Total Registrations</div>
            </div>
        </div>
        <div class="stat-card stat-green">
            <div class="stat-icon"><i class="fas fa-user-check"></i></div>
            <div class="stat-info">
                <div class="stat-value" th:text="${confirmedCount}">0</div>
                <div class="stat-label">Confirmed Attendees</div>
            </div>
        </div>
        <div class="stat-card stat-orange">
            <div class="stat-icon"><i class="fas fa-chair"></i></div>
            <div class="stat-info">
                <div class="stat-value" th:text="${availableSeats}">0</div>
                <div class="stat-label">Available Seats</div>
            </div>
        </div>
        <div class="stat-card stat-purple">
            <div class="stat-icon"><i class="fas fa-calendar-alt"></i></div>
            <div class="stat-info">
                <div class="stat-value" th:text="${totalSessions}">0</div>
                <div class="stat-label">Sessions</div>
            </div>
        </div>
    </div>

    <div class="stats-grid stats-grid-4" style="margin-top:1rem">
        <div class="stat-card stat-green mini">
            <div class="stat-value" th:text="${acceptedPapers}">0</div>
            <div class="stat-label">Accepted Papers</div>
        </div>
        <div class="stat-card stat-blue mini">
            <div class="stat-value" th:text="${totalPapers}">0</div>
            <div class="stat-label">Total Papers</div>
        </div>
        <div class="stat-card stat-yellow mini">
            <div class="stat-value" th:text="${certificatesIssued}">0</div>
            <div class="stat-label">Certificates Issued</div>
        </div>
        <div class="stat-card stat-orange mini">
            <div class="stat-value" th:text="${tracks?.size() ?: 0}">0</div>
            <div class="stat-label">Tracks</div>
        </div>
    </div>

    <div class="card" style="margin-top:1.5rem">
        <div class="card-header">
            <h3><i class="fas fa-info-circle"></i> Conference Details</h3>
        </div>
        <div class="card-body">
            <div class="detail-row">
                <label>Status:</label>
                <span th:class="'badge badge-conf-' + ${conference?.status?.name()?.toLowerCase()}"
                      th:text="${conference?.status}"></span>
            </div>
            <div class="detail-row">
                <label>Venue:</label>
                <span th:text="${conference?.venue}"></span>
            </div>
            <div class="detail-row">
                <label>Dates:</label>
                <span th:text="${conference?.startDate} + ' → ' + ${conference?.endDate}"></span>
            </div>
            <div class="detail-row">
                <label>Tracks:</label>
                <span>
                    <span th:each="t : ${tracks}" class="badge badge-track"
                          th:text="${t}" style="margin-right:0.25rem"></span>
                </span>
            </div>
        </div>
    </div>
</main>
<footer class="footer"><p>&copy; 2026 Conference Management System</p></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
